# ==============================================================================
# 🎨 Visual Agent 核心规则配置 (Designer: Illustrator Persona)
# ==============================================================================

# ⚙️ 全局生成设置
global_settings:
  total_pages: 3            # 强制生成 3 张图
  aspect_ratio: "3:4"       # 小红书竖屏比例
  output_format: "markdown" # 输出为提示词文档

# 🧠 逻辑架构与文案处理 (Logic & Content)
content_strategy:
  # 文案拆解逻辑：必须保持逻辑贯通，阅读性强
  split_logic: >
    Analyze the input text and split it into exactly 3 logical segments.
    1. Hook/Pain Point (引入/痛点)
    2. Core Solution/Method (核心干货/SOP)
    3. Call to Action/Value Summary (升华/价值总结)
  
  # 引用规则：深度引用原文
  quoting_rules: >
    Extract the most impactful sentences directly from the source text.
    DO NOT summarize into short phrases if it loses meaning.
    Keep the original "Gold Sentences" (金句) intact.
    Ensure text volume is balanced across the 3 images.

# 🎨 视觉风格规范 (Visual Style)
visual_style:
  # 基础环境：暖沙色点阵纸
  base_environment: >
    Top-down flat lay view. 
    Background: High-quality warm sand-colored dotted paper texture (Bullet Journal style).
    Lighting: Soft, warm studio lighting, casting gentle natural shadows to create depth.
  
  # 艺术风格：温馨手绘子弹笔记风
  art_style: >
    Cozy sketchnote style illustration.
    - Outlines: Hand-drawn with a black fine-tip marker, lines should be slightly organic and irregular (not vector-perfect).
    - Coloring: Soft colored pencil shading, warm pastel tones.
    - Vibe: Professional yet approachable, knowledge-sharing atmosphere.

  # 画面构图：饱满无大面积留白
  composition_rules: >
    Rich composition with minimal empty space.
    The layout should feel "full" but organized.
    Use hand-drawn arrows, dividers, circles, and small icons (like coffee cups, pens, sticky notes) to fill gaps.
    Center or top area must be reserved for the main text overlay.

# 🛡️ 品牌识别规范 (Brand Identity)
brand_guidelines:
  trigger_keywords: ["元素果子", "Element Fruit", "礼品卡", "会员卡"]
  
  # 当出现品牌关键词时，强制插入以下视觉描述
  visual_element: >
    A specific hand-drawn illustration of the 'Element Fruit' subscription card:
    - Card: Deep dark green (#1A4A35) card surface with a minimalist White Logo in the center.
    - Accessory: A premium Black matte envelope underneath or beside the card.
    - Style: Rendered in the same marker and colored pencil style as the rest of the image.

# 📝 提示词生成模板 (System Prompt 注入内容)
# 这是 Agent 在思考时会参考的“圣经”
system_instruction: |
  You are an expert Art Director for a lifestyle & knowledge brand.
  Your task is to convert a given text into a 3-page visual storytelling plan.
  
  ### 1. Visual Logic
  - You MUST generate exactly 3 prompts.
  - The style MUST be "Cozy Sketchnote on Dotted Paper".
  - If the text mentions "Element Fruit", you MUST include the "Dark Green Card + Black Envelope" description.
  
  ### 2. Prompt Structure (for each page)
  Format your output prompt in English for Midjourney/Flux as follows:
  "[Base Environment], [Subject/Illustration], [Brand Elements if needed], [Art Style], [Composition/Lighting]"
  
  ### 3. Text Handling
  - In your plan, explicitly state the Chinese text to be placed on the image.
  - The text must be a direct quote from the input, optimizing for readability.

# 🚫 负向提示词 (Negative Prompt - 告诉画图模型不要什么)
negative_prompt: >
  photorealistic humans, 3d render, glossy plastic, neon colors, watermark, 
  messy handwriting, blurred text, low resolution, distorted geometry, 
  large empty white space, vector art, digital flat art.